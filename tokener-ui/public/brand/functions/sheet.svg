<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1256 726" role="img" aria-label="tok∑ner Functions icon set"><rect width="1256" height="726" fill="#07191E"/><text x="28" y="56" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#F2F7F6">tok∑ner Functions icon set</text><rect x="28" y="98" width="64" height="64" rx="14" fill="none" stroke="#C9D2D3" stroke-width="2.5"/><g transform="translate(42 112) scale(1.5)"><g fill="none" stroke="#02F5A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 4C6.5 4 5.5 5 5.5 7v2.5c0 1.2-.8 2.1-2.2 2.5 1.4.4 2.2 1.3 2.2 2.5V17c0 2 1 3 3 3"/><path d="M15.5 4c2 0 3 1 3 3v2.5c0 1.2.8 2.1 2.2 2.5-1.4.4-2.2 1.3-2.2 2.5V17c0 2-1 3-3 3"/><path d="M14.2 8.5H9.8l2.8 3.5-2.8 3.5h4.4"/></g></g><text x="108" y="122" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F7F6">Function</text><text x="108" y="142" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">A unit of business logic that runs</text><text x="108" y="158" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">under tok∑ner governance. Braces</text><text x="108" y="174" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">around the sigma mark.</text><rect x="328" y="98" width="64" height="64" rx="14" fill="none" stroke="#C9D2D3" stroke-width="2.5"/><g transform="translate(342 112) scale(1.5)"><g fill="none" stroke="#02F5A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h10.5"/><path d="M9.8 8.3 13.5 12l-3.7 3.7"/><path d="M17.5 5v14"/><path d="M17.5 5H21M17.5 19H21"/></g></g><text x="408" y="122" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F7F6">HTTP trigger</text><text x="408" y="142" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">An authenticated endpoint. A</text><text x="408" y="158" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">request arrives at the gate.</text><rect x="628" y="98" width="64" height="64" rx="14" fill="none" stroke="#C9D2D3" stroke-width="2.5"/><g transform="translate(642 112) scale(1.5)"><g fill="none" stroke="#02F5A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 2.8 6 13.2h5.3l-.9 8 7.6-11h-5.2z"/><path d="M2.8 8.5h2M2.8 12h1.5M2.8 15.5h2"/></g></g><text x="708" y="122" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F7F6">Event trigger</text><text x="708" y="142" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">A message or application event</text><text x="708" y="158" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">starts a run.</text><rect x="928" y="98" width="64" height="64" rx="14" fill="none" stroke="#C9D2D3" stroke-width="2.5"/><g transform="translate(942 112) scale(1.5)"><g fill="none" stroke="#02F5A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/><path d="M19.5 3.5v3.2h-3.2"/></g></g><text x="1008" y="122" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F7F6">Scheduled trigger</text><text x="1008" y="142" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">A recurring schedule. A clock with</text><text x="1008" y="158" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">a repeat mark.</text><rect x="28" y="248" width="64" height="64" rx="14" fill="none" stroke="#C9D2D3" stroke-width="2.5"/><g transform="translate(42 262) scale(1.5)"><g fill="none" stroke="#02F5A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="12" r="2"/><path d="M7 6h3a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H7"/><path d="M13 12h4"/></g></g><text x="108" y="272" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F7F6">Workflow</text><text x="108" y="292" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">Steps composed into a process. Two</text><text x="108" y="308" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">branches join into one path.</text><rect x="328" y="248" width="64" height="64" rx="14" fill="none" stroke="#C9D2D3" stroke-width="2.5"/><g transform="translate(342 262) scale(1.5)"><g fill="none" stroke="#02F5A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5 12.9 9 18.5 11 12.9 13 11 18.5 9.1 13 3.5 11 9.1 9z"/><path d="M18.5 15.5v4M16.5 17.5h4"/></g></g><text x="408" y="272" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F7F6">AI call</text><text x="408" y="292" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">A model invocation through the</text><text x="408" y="308" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">gateway. A large and a small</text><text x="408" y="324" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">spark.</text><rect x="628" y="248" width="64" height="64" rx="14" fill="none" stroke="#C9D2D3" stroke-width="2.5"/><g transform="translate(642 262) scale(1.5)"><g fill="none" stroke="#02F5A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5.5c0 4.4 3 7.8 7 9.5 4-1.7 7-5.1 7-9.5V6z"/><path d="m8.8 12 2.2 2.2 4.2-4.4"/></g></g><text x="708" y="272" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F7F6">Policy gate</text><text x="708" y="292" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">Policy is evaluated before the</text><text x="708" y="308" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">step runs. A shield with a check.</text><rect x="928" y="248" width="64" height="64" rx="14" fill="none" stroke="#C9D2D3" stroke-width="2.5"/><g transform="translate(942 262) scale(1.5)"><g fill="none" stroke="#02F5A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16a8 8 0 0 1 16 0"/><path d="m12 16 3.5-4.5"/><path d="M3 20h18"/><path d="M12 8V6.5M6.3 10.3 5.2 9.2M17.7 10.3l1.1-1.1"/></g></g><text x="1008" y="272" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F7F6">Cost gate</text><text x="1008" y="292" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">A spending limit on a run or a</text><text x="1008" y="308" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">day. A gauge with a cap.</text><rect x="28" y="398" width="64" height="64" rx="14" fill="none" stroke="#C9D2D3" stroke-width="2.5"/><g transform="translate(42 412) scale(1.5)"><g fill="none" stroke="#02F5A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="8" r="3.2"/><path d="M4 20a6.5 6.5 0 0 1 10.2-5.3"/><circle cx="17.5" cy="17" r="4"/><path d="m15.7 17 1.3 1.3 2.4-2.6"/></g></g><text x="108" y="422" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F7F6">Human approval</text><text x="108" y="442" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">A person must approve before the</text><text x="108" y="458" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">run continues.</text><rect x="328" y="398" width="64" height="64" rx="14" fill="none" stroke="#C9D2D3" stroke-width="2.5"/><g transform="translate(342 412) scale(1.5)"><g fill="none" stroke="#02F5A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v5M15 3v5"/><path d="M6.5 8h11v3a5.5 5.5 0 0 1-11 0z"/><path d="M12 16.5V21"/></g></g><text x="408" y="422" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F7F6">Connector</text><text x="408" y="442" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">A governed connection to another</text><text x="408" y="458" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">system.</text><rect x="628" y="398" width="64" height="64" rx="14" fill="none" stroke="#C9D2D3" stroke-width="2.5"/><g transform="translate(642 412) scale(1.5)"><g fill="none" stroke="#02F5A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-7.5"/><path d="M12 13.5 6 7M12 13.5 18 7"/><path d="M6 10.5V7h3.5M18 10.5V7h-3.5"/></g></g><text x="708" y="422" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F7F6">Conditional route</text><text x="708" y="442" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">The result decides which branch</text><text x="708" y="458" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">runs next.</text><rect x="928" y="398" width="64" height="64" rx="14" fill="none" stroke="#C9D2D3" stroke-width="2.5"/><g transform="translate(942 412) scale(1.5)"><g fill="none" stroke="#02F5A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="m8 10.5 4 4 4-4"/><path d="M5 20h14M5 17v3M19 17v3"/></g></g><text x="1008" y="422" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F7F6">Output</text><text x="1008" y="442" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">The result is delivered to a</text><text x="1008" y="458" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">downstream system.</text><rect x="28" y="548" width="64" height="64" rx="14" fill="none" stroke="#C9D2D3" stroke-width="2.5"/><g transform="translate(42 562) scale(1.5)"><g fill="none" stroke="#02F5A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 3 8l9 4.5L21 8z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16 9 4.5 9-4.5"/></g></g><text x="108" y="572" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F7F6">Revision</text><text x="108" y="592" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">An immutable version of a</text><text x="108" y="608" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">function. Stacked layers.</text><rect x="328" y="548" width="64" height="64" rx="14" fill="none" stroke="#C9D2D3" stroke-width="2.5"/><g transform="translate(342 562) scale(1.5)"><g fill="none" stroke="#02F5A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"/></g></g><text x="408" y="572" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F7F6">Execution trace</text><text x="408" y="592" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">The recorded timeline of one</text><text x="408" y="608" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">execution.</text><rect x="628" y="548" width="64" height="64" rx="14" fill="none" stroke="#C9D2D3" stroke-width="2.5"/><g transform="translate(642 562) scale(1.5)"><g fill="none" stroke="#02F5A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></g></g><text x="708" y="572" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F7F6">Runtime</text><text x="708" y="592" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">The language runtime and its</text><text x="708" y="608" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">resource limits.</text><rect x="928" y="548" width="64" height="64" rx="14" fill="none" stroke="#C9D2D3" stroke-width="2.5"/><g transform="translate(942 562) scale(1.5)"><g fill="none" stroke="#02F5A1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6c0-1.7 3.1-3 7-3s7 1.3 7 3-3.1 3-7 3-7-1.3-7-3z"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></g></g><text x="1008" y="572" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2F7F6">Tokens</text><text x="1008" y="592" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">Token consumption, stacked as</text><text x="1008" y="608" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9AA9AD">coins.</text></svg>
